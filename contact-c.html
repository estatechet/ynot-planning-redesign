<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시안 C — Layered Card | YNOT Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=102">
<style>
  body{background:#EEF2F8;min-height:100vh}
  .page-wrap{max-width:780px;margin:120px auto 100px;padding:0 24px}
  .scheme-tag{display:inline-block;padding:6px 14px;border-radius:100px;background:#0F4B96;color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.1em;margin-bottom:24px}

  /* Stack: 책상 위 명함 + 그 위 폼 */
  .stack{position:relative;padding-bottom:40px}
  /* 배경 명함 (살짝 회전) */
  .stack-card{
    width:88%;max-width:560px;aspect-ratio:1.8/1;
    background:linear-gradient(135deg,#0A2E6A 0%,#0F4B96 60%,#1565B8 100%);
    color:#fff;border-radius:18px;padding:28px 32px;
    position:absolute;top:-30px;left:60px;transform:rotate(-4deg);
    box-shadow:0 24px 60px -10px rgba(15,75,150,.35),0 6px 16px rgba(0,0,0,.1);
    overflow:hidden;z-index:1;
  }
  .stack-card::before{
    content:"";position:absolute;top:-30%;right:-20%;width:80%;height:120%;
    background:radial-gradient(ellipse,rgba(0,168,168,.28),transparent 65%);pointer-events:none;
  }
  .sc-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative;z-index:1}
  .sc-mark{width:36px;height:36px;border-radius:10px;background:#fff;color:#0F4B96;font-weight:900;font-size:.92rem;display:flex;align-items:center;justify-content:center}
  .sc-brand{font-size:.92rem;font-weight:700}
  .sc-brand small{display:block;font-family:'Playfair Display',serif;font-style:italic;font-size:.7rem;color:rgba(255,255,255,.6);margin-top:1px}
  .sc-info{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:rgba(255,255,255,.82);line-height:1.5}
  .sc-info strong{color:#fff;font-weight:600;margin-right:8px}
  .sc-ceo{position:absolute;right:32px;bottom:20px;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .sc-ceo span{font-size:.65rem;color:rgba(255,255,255,.5);letter-spacing:.14em;text-transform:uppercase}
  .sc-ceo strong{font-size:.95rem;font-weight:700;color:#fff;letter-spacing:.05em;display:inline-flex;align-items:center;gap:8px}
  .sc-ceo strong img{height:24px;width:auto;opacity:.85;filter:brightness(0) invert(1)}

  /* 위 폼 카드 (floating) */
  .stack-form{
    position:relative;z-index:2;
    background:#fff;border-radius:20px;padding:48px 44px;
    box-shadow:0 32px 80px -20px rgba(15,75,150,.22),0 8px 20px rgba(0,0,0,.06);
    margin-top:130px;
    transform:rotate(.5deg);
  }
  .sf-head{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--c-border)}
  .sf-eyebrow{font-family:'Playfair Display',serif;font-style:italic;font-size:.82rem;color:var(--c-teal);letter-spacing:.14em;margin-bottom:8px}
  .sf-title{font-size:1.4rem;font-weight:800;color:var(--c-text);letter-spacing:-.025em;margin-bottom:4px}
  .sf-sub{font-size:.8rem;color:var(--c-sub)}
  .sf-form .form-group{margin-bottom:16px}
  .sf-form label{display:block;font-size:.76rem;font-weight:600;color:var(--c-text);margin-bottom:7px}
  .sf-form input,.sf-form select,.sf-form textarea{
    width:100%;padding:11px 14px;border:1px solid var(--c-border);border-radius:9px;
    font-family:inherit;font-size:.88rem;color:var(--c-text);background:#fafbfc;
    transition:all .2s;
  }
  .sf-form input:focus,.sf-form select:focus,.sf-form textarea:focus{outline:none;border-color:#0F4B96;background:#fff;box-shadow:0 0 0 3px rgba(15,75,150,.08)}
  .sf-form .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sf-submit{
    width:100%;padding:14px;background:linear-gradient(135deg,#0F4B96,#1565B8);
    color:#fff;border:none;border-radius:11px;font-size:.92rem;font-weight:700;
    cursor:pointer;transition:.2s;margin-top:10px;
  }
  .sf-submit:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,75,150,.3)}

  @media(max-width:700px){
    .stack-card{display:none}
    .stack-form{margin-top:0;transform:none;padding:32px 24px}
  }
</style>
</head>
<body>
<div class="page-wrap">
  <span class="scheme-tag">시안 C · Layered Card</span>

  <div class="stack">
    <!-- 배경 명함 (회전된 채로 살짝 보임) -->
    <div class="stack-card">
      <div class="sc-logo">
        <div class="sc-mark">YNP</div>
        <div class="sc-brand">(주)와이낫플래닝<small>YNOT Planning</small></div>
      </div>
      <div class="sc-info">
        <div><strong>TEL</strong> 02-6022-8793</div>
        <div><strong>MAIL</strong> ynp073@ynp.uplusworks.co.kr</div>
        <div><strong>ADD</strong> 서울 강서구 마곡서로 152</div>
      </div>
      <div class="sc-ceo">
        <span>대표이사</span>
        <strong>박 찬 주<img src="img/ceo_signature.png" alt="서명"></strong>
      </div>
    </div>

    <!-- 위에 올린 폼 카드 -->
    <div class="stack-form">
      <div class="sf-head">
        <div class="sf-eyebrow">Contact Form</div>
        <h3 class="sf-title">프로젝트 상담 문의</h3>
        <p class="sf-sub">영업일 기준 1~2일 내 회신드립니다.</p>
      </div>
      <form class="sf-form">
        <div class="form-row">
          <div class="form-group"><label>이름 *</label><input type="text" placeholder="홍길동" required></div>
          <div class="form-group"><label>연락처 *</label><input type="tel" placeholder="010-0000-0000" required></div>
        </div>
        <div class="form-group"><label>이메일</label><input type="email" placeholder="example@email.com"></div>
        <div class="form-group"><label>소속 / 회사명</label><input type="text" placeholder="회사명 또는 소속"></div>
        <div class="form-group"><label>문의 유형 *</label>
          <select required><option value="">선택해 주세요</option><option>분양대행</option><option>컨설팅</option><option>마케팅</option><option>금융</option><option>채용</option><option>기타</option></select>
        </div>
        <div class="form-group"><label>문의 내용 *</label><textarea rows="5" placeholder="프로젝트 개요, 세대수, 원하시는 서비스 등을 자세히 입력해 주세요" required></textarea></div>
        <button type="submit" class="sf-submit">문의 보내기 →</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
