<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="mapTitle">
  <title id="mapTitle">와이낫플래닝 위치 안내 — 두산더랜드타워 B동</title>

  <!-- 배경 -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e7edf3" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="3" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- 한강 (북쪽 영역 살짝) -->
  <path d="M 0 60 Q 200 50 400 70 Q 600 90 800 75 L 800 0 L 0 0 Z"
        fill="#dbe9f3" opacity="0.55"/>
  <text x="40" y="42" font-family="Noto Sans KR, sans-serif" font-size="13" fill="#7493b0" font-weight="500">한강</text>

  <!-- 공원/녹지 (서쪽 — 서울식물원 영역) -->
  <path d="M 30 230 Q 50 200 110 195 Q 170 200 195 240 Q 200 290 165 320 Q 100 330 50 305 Q 20 280 30 230 Z"
        fill="#e3eedc" opacity="0.85"/>
  <text x="65" y="270" font-family="Noto Sans KR, sans-serif" font-size="12" fill="#5a7f49" font-weight="600">서울식물원</text>

  <!-- 도로: 공항대로 (가로 큰길) -->
  <path d="M 0 410 L 800 410" stroke="#cdd5de" stroke-width="38"/>
  <path d="M 0 410 L 800 410" stroke="#ffffff" stroke-width="34"/>
  <path d="M 0 410 L 800 410" stroke="#cdd5de" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.6"/>
  <text x="20" y="404" font-family="Noto Sans KR, sans-serif" font-size="12" fill="#566679" font-weight="700">공항대로</text>

  <!-- 도로: 마곡서로 (가로 — 사무실 앞) -->
  <path d="M 0 240 L 800 240" stroke="#cdd5de" stroke-width="28"/>
  <path d="M 0 240 L 800 240" stroke="#ffffff" stroke-width="24"/>
  <text x="20" y="234" font-family="Noto Sans KR, sans-serif" font-size="12" fill="#566679" font-weight="700">마곡서로</text>

  <!-- 도로: 마곡중앙로 (세로) -->
  <path d="M 260 60 L 260 500" stroke="#cdd5de" stroke-width="24"/>
  <path d="M 260 60 L 260 500" stroke="#ffffff" stroke-width="20"/>
  <text x="265" y="80" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#566679" font-weight="600" transform="rotate(-90 265 80)">마곡중앙로</text>

  <!-- 도로: 마곡동로 (세로 동쪽) -->
  <path d="M 580 60 L 580 500" stroke="#cdd5de" stroke-width="20"/>
  <path d="M 580 60 L 580 500" stroke="#ffffff" stroke-width="16"/>

  <!-- 지하철 5호선 (공항대로 따라) — 보라색 -->
  <path d="M 0 410 L 800 410" stroke="#996cac" stroke-width="3" stroke-dasharray="2,4" opacity="0.85"/>

  <!-- 지하철 9호선/공항철도 (북서쪽으로 가는 선) — 짙은 청록 -->
  <path d="M 0 145 Q 120 145 195 170 Q 260 200 320 240" stroke="#3a7d9c" stroke-width="3" stroke-dasharray="2,4" opacity="0.85" fill="none"/>

  <!-- 건물 블록들 (도시 텍스처) -->
  <g opacity="0.55">
    <rect x="320" y="140" width="80" height="80" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="410" y="140" width="60" height="80" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="480" y="140" width="80" height="80" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="620" y="140" width="120" height="80" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <text x="660" y="186" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#7e8a9b" font-weight="600" text-anchor="middle">LG사이언스파크</text>

    <rect x="320" y="260" width="80" height="60" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="410" y="260" width="60" height="60" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="480" y="260" width="80" height="60" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="620" y="260" width="60" height="60" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="700" y="260" width="60" height="60" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>

    <rect x="320" y="340" width="80" height="50" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="410" y="340" width="60" height="50" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="480" y="340" width="80" height="50" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
    <rect x="620" y="340" width="120" height="50" rx="4" fill="#f0f3f7" stroke="#dfe4eb"/>
  </g>

  <!-- ★ 두산더랜드타워 (하이라이트) -->
  <g filter="url(#softShadow)">
    <rect x="425" y="262" width="58" height="58" rx="5" fill="#0F4B96"/>
    <rect x="425" y="262" width="58" height="14" fill="#0a356b"/>
    <line x1="439" y1="284" x2="439" y2="320" stroke="#3672bd" stroke-width="0.7"/>
    <line x1="454" y1="284" x2="454" y2="320" stroke="#3672bd" stroke-width="0.7"/>
    <line x1="469" y1="284" x2="469" y2="320" stroke="#3672bd" stroke-width="0.7"/>
    <line x1="425" y1="296" x2="483" y2="296" stroke="#3672bd" stroke-width="0.7"/>
    <line x1="425" y1="308" x2="483" y2="308" stroke="#3672bd" stroke-width="0.7"/>
  </g>

  <!-- 두산더랜드타워 라벨 -->
  <g>
    <rect x="370" y="200" width="170" height="44" rx="6" fill="#ffffff" stroke="#0F4B96" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="455" y="219" font-family="Noto Sans KR, sans-serif" font-size="13" fill="#0F4B96" font-weight="800" text-anchor="middle">두산더랜드타워</text>
    <text x="455" y="236" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#566679" text-anchor="middle">B동 1318–1323호</text>
    <!-- 화살표 라벨 → 건물 -->
    <path d="M 455 246 L 455 260" stroke="#0F4B96" stroke-width="1.6"/>
    <polygon points="455,266 450,256 460,256" fill="#0F4B96"/>
  </g>

  <!-- 핀 위에 별 (대표 위치) -->
  <g transform="translate(454,255)" filter="url(#pinShadow)">
    <path d="M 0 -16 a 14 14 0 1 1 0 28 a 14 14 0 1 1 0 -28 z" fill="#00A8A8"/>
    <path d="M 0 -10 L 2.5 -3 L 10 -3 L 4 1.5 L 6 9 L 0 4.5 L -6 9 L -4 1.5 L -10 -3 L -2.5 -3 Z" fill="#ffffff"/>
  </g>

  <!-- 지하철역: 마곡나루역 (서쪽) -->
  <g>
    <circle cx="150" cy="165" r="12" fill="#ffffff" stroke="#3a7d9c" stroke-width="3" filter="url(#softShadow)"/>
    <text x="150" y="170" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#3a7d9c" font-weight="800" text-anchor="middle">9</text>
    <rect x="92" y="183" width="125" height="22" rx="11" fill="#ffffff" stroke="#3a7d9c" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="154" y="198" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#234e63" font-weight="700" text-anchor="middle">마곡나루역</text>
    <text x="100" y="198" font-family="Noto Sans KR, sans-serif" font-size="9.5" fill="#3a7d9c" font-weight="800">★</text>
  </g>

  <!-- 도보 경로: 마곡나루역 → 회사 -->
  <path d="M 165 178 Q 230 200 290 232 Q 360 260 425 280"
        fill="none" stroke="#00A8A8" stroke-width="2" stroke-dasharray="6,5" opacity="0.85"/>
  <g transform="translate(310,238)">
    <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#00A8A8"/>
    <text x="0" y="4" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">도보 8분</text>
  </g>

  <!-- 지하철역: 마곡역 (남쪽) -->
  <g>
    <circle cx="455" cy="410" r="14" fill="#ffffff" stroke="#996cac" stroke-width="3" filter="url(#softShadow)"/>
    <text x="455" y="415" font-family="Noto Sans KR, sans-serif" font-size="12" fill="#996cac" font-weight="800" text-anchor="middle">5</text>
    <rect x="395" y="430" width="120" height="22" rx="11" fill="#ffffff" stroke="#996cac" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="455" y="445" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#5e3970" font-weight="700" text-anchor="middle">마곡역</text>
  </g>

  <!-- 도보 경로: 마곡역 → 회사 -->
  <path d="M 455 396 L 455 328" fill="none" stroke="#00A8A8" stroke-width="2" stroke-dasharray="6,5" opacity="0.85"/>
  <g transform="translate(520,365)">
    <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#00A8A8"/>
    <text x="0" y="4" font-family="Noto Sans KR, sans-serif" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">도보 5분</text>
  </g>

  <!-- 나침반 -->
  <g transform="translate(740,80)">
    <circle r="22" fill="#ffffff" stroke="#cdd5de" stroke-width="1"/>
    <polygon points="0,-15 4,0 0,-3 -4,0" fill="#0F4B96"/>
    <polygon points="0,15 4,0 0,3 -4,0" fill="#cdd5de"/>
    <text x="0" y="-26" font-family="Noto Sans KR, sans-serif" font-size="10" fill="#0F4B96" font-weight="800" text-anchor="middle">N</text>
  </g>

  <!-- 범례 -->
  <g transform="translate(20,455)">
    <rect x="0" y="0" width="430" height="34" rx="6" fill="#ffffff" stroke="#dfe4eb"/>
    <!-- 회사 -->
    <circle cx="20" cy="17" r="6" fill="#00A8A8"/>
    <text x="33" y="21" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#3a4a5e" font-weight="600">와이낫플래닝</text>
    <!-- 9호선 -->
    <circle cx="138" cy="17" r="6" fill="#ffffff" stroke="#3a7d9c" stroke-width="2.5"/>
    <text x="151" y="21" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#3a4a5e" font-weight="600">9호선·공항철도</text>
    <!-- 5호선 -->
    <circle cx="268" cy="17" r="6" fill="#ffffff" stroke="#996cac" stroke-width="2.5"/>
    <text x="281" y="21" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#3a4a5e" font-weight="600">5호선</text>
    <!-- 도보경로 -->
    <line x1="328" y1="17" x2="346" y2="17" stroke="#00A8A8" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="354" y="21" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#3a4a5e" font-weight="600">도보 경로</text>
  </g>

  <!-- 주소 박스 -->
  <g transform="translate(560,455)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#0F4B96"/>
    <text x="110" y="15" font-family="Noto Sans KR, sans-serif" font-size="10" fill="#a5c6f0" font-weight="600" text-anchor="middle">YNOT PLANNING</text>
    <text x="110" y="28" font-family="Noto Sans KR, sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">마곡서로 152, B동 1318–1323</text>
  </g>
</svg>
