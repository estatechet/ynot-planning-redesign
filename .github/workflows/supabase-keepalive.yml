name: Supabase Keep-Alive

# 매주 월요일과 목요일 00:00 UTC (KST 09:00) 에 Supabase REST 를 1회 호출하여
# Free 플랜의 7일 비활성 자동 일시중지를 방지한다.
# 수동 실행: GitHub Actions 탭 → Run workflow

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 09:00 KST
    - cron: '0 0 * * 4'   # 매주 목요일 09:00 KST (백업)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://jclrsdeinpglzhntwyqd.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjbHJzZGVpbnBnbHpobnR3eXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDQ5MDcsImV4cCI6MjA5NTg4MDkwN30.oI-U_poTjQQ8WxBD-V8O2FQVzjrj-0Zgr6fO5xx536g
        run: |
          set -e
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/press_releases?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          echo
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase keep-alive ping failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Supabase is alive."
