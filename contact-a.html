<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시안 A — Split Card | YNOT Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=102">
<style>
  body{background:#f4f6fa}
  .page-wrap{max-width:1180px;margin:120px auto 80px;padding:0 24px}
  .scheme-tag{display:inline-block;padding:6px 14px;border-radius:100px;background:#0F4B96;color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.1em;margin-bottom:24px}

  /* 명함 + 폼 Split Card */
  .biz-card{
    display:grid;grid-template-columns:5fr 7fr;
    background:#fff;border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(15,75,150,.22),0 6px 16px rgba(15,75,150,.08);
    min-height:720px;
  }
  /* LEFT: 명함 */
  .bc-left{
    background:linear-gradient(135deg,#0A2E6A 0%,#0F4B96 60%,#1565B8 100%);
    color:#fff;padding:56px 48px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .bc-left::before{
    content:"";position:absolute;top:-30%;right:-20%;width:80%;height:120%;
    background:radial-gradient(ellipse,rgba(0,168,168,.28),transparent 65%);
    pointer-events:none;
  }
  .bc-left::after{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.04) 1px,transparent 0);
    background-size:36px 36px;pointer-events:none;
  }
  .bc-left > *{position:relative;z-index:1}
  .bc-logo{display:flex;align-items:center;gap:14px;margin-bottom:28px}
  .bc-logo-mark{
    width:48px;height:48px;border-radius:12px;
    background:linear-gradient(135deg,#fff,#E8F0FC);
    display:flex;align-items:center;justify-content:center;
    color:#0F4B96;font-weight:900;font-size:1.1rem;letter-spacing:-.02em;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .bc-brand-name{font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:-.01em;margin-bottom:2px}
  .bc-brand-en{font-family:'Playfair Display',serif;font-style:italic;font-size:.82rem;color:rgba(255,255,255,.65);letter-spacing:.04em}
  .bc-title{
    font-family:'Playfair Display',serif;font-size:.78rem;font-style:italic;
    color:rgba(0,168,168,.95);letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;
  }
  .bc-heading{font-size:1.85rem;font-weight:800;line-height:1.25;letter-spacing:-.025em;margin-bottom:36px}
  .bc-heading .em{color:#7DDDDD}
  .bc-info{display:flex;flex-direction:column;gap:16px;margin-bottom:auto;font-size:.86rem;line-height:1.6}
  .bc-info-row{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;color:rgba(255,255,255,.86)}
  .bc-info-row svg{color:rgba(0,168,168,.9);margin-top:3px}
  .bc-info-row strong{color:#fff;font-weight:600;display:block;margin-bottom:2px}
  .bc-divider{height:1px;background:rgba(255,255,255,.12);margin:32px 0 24px}
  .bc-ceo{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .bc-ceo-label{font-size:.72rem;color:rgba(255,255,255,.5);letter-spacing:.16em;text-transform:uppercase}
  .bc-ceo-name{font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:.06em;display:inline-flex;align-items:center;gap:12px}
  .bc-ceo-name img{height:30px;width:auto;opacity:.85;filter:brightness(0) invert(1)}

  /* RIGHT: 폼 */
  .bc-right{padding:56px 48px;background:#fff}
  .bc-form-head{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--c-border)}
  .bc-form-eyebrow{font-family:'Playfair Display',serif;font-style:italic;font-size:.85rem;color:var(--c-teal);letter-spacing:.14em;margin-bottom:10px}
  .bc-form-title{font-size:1.45rem;font-weight:800;color:var(--c-text);letter-spacing:-.025em;margin-bottom:6px}
  .bc-form-sub{font-size:.82rem;color:var(--c-sub)}
  .bc-form .form-group{margin-bottom:18px}
  .bc-form label{display:block;font-size:.78rem;font-weight:600;color:var(--c-text);margin-bottom:8px;letter-spacing:-.005em}
  .bc-form input,.bc-form select,.bc-form textarea{
    width:100%;padding:13px 16px;border:1px solid var(--c-border);border-radius:10px;
    font-family:inherit;font-size:.9rem;color:var(--c-text);background:#fff;
    transition:border-color .2s,box-shadow .2s;
  }
  .bc-form input:focus,.bc-form select:focus,.bc-form textarea:focus{
    outline:none;border-color:#0F4B96;box-shadow:0 0 0 3px rgba(15,75,150,.08);
  }
  .bc-form .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .bc-submit{
    width:100%;padding:16px;background:linear-gradient(135deg,#0F4B96,#1565B8);
    color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:700;
    cursor:pointer;transition:transform .2s,box-shadow .2s;margin-top:14px;
  }
  .bc-submit:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,75,150,.3)}

  @media(max-width:900px){
    .biz-card{grid-template-columns:1fr}
    .bc-left,.bc-right{padding:40px 28px}
    .bc-heading{font-size:1.5rem}
  }
</style>
</head>
<body>
<div class="page-wrap">
  <span class="scheme-tag">시안 A · Split Card</span>
  <div class="biz-card">
    <!-- 좌측 명함 -->
    <div class="bc-left">
      <div class="bc-logo">
        <div class="bc-logo-mark">YNP</div>
        <div>
          <div class="bc-brand-name">(주)와이낫플래닝</div>
          <div class="bc-brand-en">YNOT Planning</div>
        </div>
      </div>
      <div class="bc-title">Project Consulting</div>
      <h2 class="bc-heading">분양의 다음 장,<br>YNP와 <span class="em">함께</span> 씁니다.</h2>

      <div class="bc-info">
        <div class="bc-info-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.37 1.9.72 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0122 16.92z"/></svg>
          <div><strong>02-6022-8793</strong><span>FAX 02-2088-4040</span></div>
        </div>
        <div class="bc-info-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <div><strong>ynp073@ynp.uplusworks.co.kr</strong></div>
        </div>
        <div class="bc-info-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <div><strong>서울특별시 강서구 마곡서로 152</strong><span>두산더랜드타워 B동 1318-1323호</span></div>
        </div>
      </div>

      <div class="bc-divider"></div>
      <div class="bc-ceo">
        <span class="bc-ceo-label">대표이사</span>
        <span class="bc-ceo-name">박 찬 주<img src="img/ceo_signature.png" alt="서명"></span>
      </div>
    </div>

    <!-- 우측 폼 -->
    <div class="bc-right">
      <div class="bc-form-head">
        <div class="bc-form-eyebrow">Contact Form</div>
        <h3 class="bc-form-title">프로젝트 상담 문의</h3>
        <p class="bc-form-sub">영업일 기준 1~2일 내 담당 컨설턴트가 회신드립니다.</p>
      </div>
      <form class="bc-form" id="contactForm">
        <div class="form-row">
          <div class="form-group"><label>이름 *</label><input type="text" placeholder="홍길동" required></div>
          <div class="form-group"><label>연락처 *</label><input type="tel" placeholder="010-0000-0000" required></div>
        </div>
        <div class="form-group"><label>이메일</label><input type="email" placeholder="example@email.com"></div>
        <div class="form-group"><label>소속 / 회사명</label><input type="text" placeholder="회사명 또는 소속"></div>
        <div class="form-group"><label>문의 유형 *</label>
          <select required>
            <option value="">선택해 주세요</option><option>분양대행 문의</option><option>시장조사 / 컨설팅 문의</option>
            <option>마케팅 전략 문의</option><option>금융 컨설팅 문의</option><option>채용 문의</option><option>기타</option>
          </select></div>
        <div class="form-group"><label>문의 내용 *</label><textarea rows="5" placeholder="프로젝트 개요, 세대수, 원하시는 서비스 등을 자세히 입력해 주세요." required></textarea></div>
        <button type="submit" class="bc-submit">문의 보내기 →</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
